name: Qishui Sign Smoke (macOS arm64)

# 决定性实验：官方 macOS 汽水客户端里的 bdms.node 是未加密的 arm64 Darwin 组件。
# 这里在 macOS arm64 runner 上原样加载它，为 /luna/pc/track_v2 生成
# X-Helios / X-Medusa，然后发一个不带 cookie 的请求。
#
# 版本必须用当前官方客户端（3.7.0）：2.1.0 的组件能加载、能出签名，但服务端
# 返回 200 + 空 body（签名被拒）。版本号从官方 settings 接口的
# pc_download.darwin.arm64.url 取，不要用下载页 JS 里的旧 fallback 链接。
#
# 判据：响应不是空 body。未签名的同一请求稳定返回 HTTP 200 + content-length 0；
# 签名被接受时，即使没有登录态也会返回结构化 JSON。
#
# 不提交、不上传任何专有二进制；官方小包（.tgz，约 19MB）在 runner 上现场下载并解包。
# 小包里的 app.asar.unpacked/ 直接包含 bdms.node + libMetaSecML.dylib，不需要挂载 DMG。
# 触发：手动，或推送到 mobile-shell 时改了本工作流/探针脚本。

on:
  workflow_dispatch:
  push:
    branches: [mobile-shell]
    paths:
      - '.github/workflows/qishui-sign-smoke.yml'
      - 'dev/mobile/qishui-sign-smoke.cjs'

permissions:
  contents: read

concurrency:
  group: qishui-sign-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: bdms.node signed track_v2 (no cookie)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node.js 18 (arm64)
        uses: actions/setup-node@v6
        with:
          node-version: '18.20.4'
          architecture: arm64

      - name: Show runner and Node architecture
        run: |
          set -euo pipefail
          uname -m
          node -p "process.version + ' ' + process.arch + ' ' + process.platform"
          test "$(node -p process.arch)" = "arm64"

      - name: Download official macOS native package
        env:
          PACKAGE_URL: https://lf-luna-release.qishui.com/obj/luna-release/3.7.0/452316191/SodaMusic-v3.7.0-official-darwin_arm64.tgz
          PACKAGE_SHA256: 40c6bc80aa32cd1d5c76ad1b05bccc67e5ec22cf779b6dc3617ee5432b88ee04
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qishui"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/qishui/native-package.tgz" "$PACKAGE_URL"
          echo "$PACKAGE_SHA256  $RUNNER_TEMP/qishui/native-package.tgz" | shasum -a 256 -c -
          ls -lh "$RUNNER_TEMP/qishui/native-package.tgz"

      - name: Extract bdms.node and libMetaSecML.dylib
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/qishui/native-package.tgz"
          OUT="$RUNNER_TEMP/qishui/pkg"
          mkdir -p "$OUT"
          tar -xzf "$PKG" -C "$OUT"

          BDMS="$(find "$OUT" -name bdms.node -type f | head -n 1)"
          DYLIB="$(find "$OUT" -name libMetaSecML.dylib -type f | head -n 1)"
          test -n "$BDMS"
          test -n "$DYLIB"
          cp "$BDMS" "$RUNNER_TEMP/qishui/bdms.node"
          cp "$DYLIB" "$RUNNER_TEMP/qishui/libMetaSecML.dylib"
          echo "bdms=$BDMS"
          echo "dylib=$DYLIB"
          file "$RUNNER_TEMP/qishui/bdms.node" "$RUNNER_TEMP/qishui/libMetaSecML.dylib"
          lipo -info "$RUNNER_TEMP/qishui/bdms.node"
          ls -l "$RUNNER_TEMP/qishui"

      - name: Run no-cookie signing probe
        env:
          # 让 addon 的 @rpath/libMetaSecML.dylib 能被 dyld 找到。
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/qishui
        run: |
          set -euo pipefail
          node dev/mobile/qishui-sign-smoke.cjs "$RUNNER_TEMP/qishui/bdms.node"

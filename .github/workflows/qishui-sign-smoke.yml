name: Qishui Sign Smoke (macOS arm64)

# 决定性实验：官方 macOS 汽水客户端里的 bdms.node 是未加密的 arm64 Darwin 组件。
# 这里在 macOS arm64 runner 上原样加载它，为 /luna/pc/track_v2 生成
# X-Helios / X-Medusa，然后发一个不带 cookie 的请求。
#
# 判据：响应不是空 body。未签名的同一请求稳定返回 HTTP 200 + content-length 0；
# 签名被接受时，即使没有登录态也会返回结构化 JSON。
#
# 不提交、不上传任何专有二进制；DMG 在 runner 上现场下载并解包。
# 触发：手动，或推送到 mobile-shell 时改了本工作流/探针脚本。

on:
  workflow_dispatch:
  push:
    branches: [mobile-shell]
    paths:
      - '.github/workflows/qishui-sign-smoke.yml'
      - 'dev/mobile/qishui-sign-smoke.cjs'

permissions:
  contents: read

concurrency:
  group: qishui-sign-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: bdms.node signed track_v2 (no cookie)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node.js 18 (arm64)
        uses: actions/setup-node@v6
        with:
          node-version: '18.20.4'
          architecture: arm64

      - name: Show runner and Node architecture
        run: |
          set -euo pipefail
          uname -m
          node -p "process.version + ' ' + process.arch + ' ' + process.platform"
          test "$(node -p process.arch)" = "arm64"

      - name: Download official macOS client
        env:
          DMG_URL: https://lf-luna-release.qishui.com/obj/luna-release/2.1.0/12292405/SodaMusic-v2.1.0-official-darwin_arm64.dmg
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qishui"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/qishui/SodaMusic.dmg" "$DMG_URL"
          ls -lh "$RUNNER_TEMP/qishui/SodaMusic.dmg"

      - name: Extract bdms.node and libMetaSecML.dylib
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/qishui/SodaMusic.dmg"
          MOUNT="$RUNNER_TEMP/qishui/mnt"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          echo "mounted at $MOUNT"

          BDMS="$(find "$MOUNT" -name bdms.node -type f | head -n 1)"
          DYLIB="$(find "$MOUNT" -name libMetaSecML.dylib -type f | head -n 1)"

          # 官方包里组件通常在 app.asar.unpacked；若被重新打进 app.asar，则现场解包。
          if [ -z "$BDMS" ] || [ -z "$DYLIB" ]; then
            echo "not found in plain files; trying app.asar extraction"
            ASAR="$(find "$MOUNT" -name app.asar -type f | head -n 1)"
            test -n "$ASAR"
            mkdir -p "$RUNNER_TEMP/qishui/asar"
            npx --yes @electron/asar extract "$ASAR" "$RUNNER_TEMP/qishui/asar"
            BDMS="$(find "$RUNNER_TEMP/qishui/asar" -name bdms.node -type f | head -n 1)"
            DYLIB="$(find "$RUNNER_TEMP/qishui/asar" -name libMetaSecML.dylib -type f | head -n 1)"
          fi

          test -n "$BDMS"
          test -n "$DYLIB"
          cp "$BDMS" "$RUNNER_TEMP/qishui/bdms.node"
          cp "$DYLIB" "$RUNNER_TEMP/qishui/libMetaSecML.dylib"
          echo "bdms=$BDMS"
          echo "dylib=$DYLIB"
          file "$RUNNER_TEMP/qishui/bdms.node" "$RUNNER_TEMP/qishui/libMetaSecML.dylib"
          lipo -info "$RUNNER_TEMP/qishui/bdms.node"
          ls -l "$RUNNER_TEMP/qishui"

          hdiutil detach "$MOUNT" || true

      - name: Run no-cookie signing probe
        env:
          # 让 addon 的 @rpath/libMetaSecML.dylib 能被 dyld 找到。
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/qishui
        run: |
          set -euo pipefail
          node dev/mobile/qishui-sign-smoke.cjs "$RUNNER_TEMP/qishui/bdms.node"

      - name: Detach DMG on failure
        if: always()
        run: |
          MOUNT="$RUNNER_TEMP/qishui/mnt"
          if mount | grep -q "$MOUNT"; then hdiutil detach "$MOUNT" || true; fi

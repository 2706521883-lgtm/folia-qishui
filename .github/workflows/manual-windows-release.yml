name: Manual Windows Release Asset

# 临时工作流：在 GitHub 的 Windows runner 上构建 0.3.2 安装包并补传到已有 Release。
# 本机上行带宽过低，157 MB 的安装包无法直接上传；用 runner 构建可绕开该限制。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and upload Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build wallpaper helper
        run: node packaging/windows/build-wallpaper-helper.mjs

      - name: Build web app for Electron
        env:
          ELECTRON: 'true'
          APP_VERSION_LABEL: Realeco
          APP_RELEASE_CHANNEL: realeco
        run: npm run build

      - name: Package Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish never --config.publish.channel=latest

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem release | Format-Table Name, Length

      - name: Upload to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.3.2 \
            release/Folia-Setup-0.3.2.exe \
            release/Folia-Setup-0.3.2.exe.blockmap \
            release/latest.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release view v0.3.2 --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[] | [.name, .state, .size] | @tsv'
